name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  backend:
    name: Backend checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.27.2
          cache: true

      # The real frontend build is injected by the release workflow; the
      # repository only carries a .gitkeep placeholder, which is enough for
      # go:embed all:dist to compile (the index page then reports that the
      # frontend is not built).
      - name: Ensure the embed directory exists
        run: test -f internal/web/dist/.gitkeep

      - name: gofmt check
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "Unformatted files, run make fmt:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: CGO_ENABLED=0 go vet ./...

      # The shipped artifact is a CGO_ENABLED=0 single binary, so run the
      # suite in release configuration first.
      - name: go test
        run: CGO_ENABLED=0 go test ./...

      # The race detector requires cgo, so CGO_ENABLED must stay enabled
      # here (it errors out when disabled). SQLite uses a pure-Go driver,
      # so enabling cgo does not swap the implementation - it only adds
      # the race runtime.
      - name: go test -race
        run: CGO_ENABLED=1 go test -race ./...

  frontend:
    name: Frontend checks
    runs-on: ubuntu-latest
    steps:
      - name: Checkout frontend
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          repository: SakuraOpenSource/levis-frontend
          ref: main

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.4.2

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26.7.0
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      # The build script itself is `vue-tsc -b && vite build`, so type
      # checking is included.
      - run: pnpm exec vue-tsc -b
      - run: pnpm test
      - run: pnpm build
