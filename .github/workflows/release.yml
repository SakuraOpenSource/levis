name: Release

# Two ways to trigger:
#   - Manual: fill in the release tag (and optional name) on the Actions page;
#     the tag is created on the current commit when it does not exist yet.
#   - Tag push: `git tag v0.1.0 && git push --tags`; the name defaults to the tag.
#
# Tag shape decides the release kind:
#   - v1.2.3            -> stable release
#   - v1.2.3-rc.1       -> pre-release (GitHub "Pre-release" flag set)
#
# Release notes scope:
#   - pre-release: every commit since the last release of ANY kind
#   - stable:      every commit since the last STABLE release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. v0.1.0 (created on the current commit if missing)'
        required: true
      name:
        description: 'Release name; defaults to the tag'
        required: false
      prerelease:
        description: 'Force a pre-release (tags with a suffix are always pre-releases)'
        type: boolean
        default: false
      frontend_ref:
        description: 'Frontend ref; resolved commit SHA is recorded in manifest'
        required: false
        default: 'main'
  push:
    tags: ['v*']

permissions:
  contents: read

jobs:
  build:
    name: Build verified release payload
    runs-on: ubuntu-latest
    permissions:
      contents: read
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
      name: ${{ steps.meta.outputs.name || steps.meta.outputs.tag }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - name: Checkout source
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Resolve release metadata
        id: meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_NAME: ${{ inputs.name }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$INPUT_TAG"
          else
            tag="$GITHUB_REF_NAME"
          fi

          # case takes the first matching pattern and "*" eats suffixes like
          # case takes the first matching pattern and "*" eats suffixes like
          # "-rc.1", so the suffixed (pre-release) pattern must come first.
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?$ ]] || { echo "Invalid release tag" >&2; exit 1; }
          case "$tag" in
            v[0-9]*.[0-9]*.[0-9]*-*)
              prerelease=true ;;
            v[0-9]*.[0-9]*.[0-9]*)
              prerelease=false ;;
            *)
              echo "Tag must look like v1.2.3 (stable) or v1.2.3-rc.1 (pre-release), got: $tag"
              exit 1 ;;
          esac
          # The manual checkbox can force a stable tag out as a pre-release.
          if [ "$INPUT_PRERELEASE" = "true" ]; then
            prerelease=true
          fi

          name="${INPUT_NAME:-$tag}"
          [[ "$name" != *$'\n'* && "$name" != *$'\r'* ]] || { echo "Invalid release name" >&2; exit 1; }
          {
            echo "tag=$tag"
            echo "name=$name"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing $tag (name: $name, prerelease: $prerelease)"

      - name: Generate release notes
        env:
          PRERELEASE: ${{ steps.meta.outputs.prerelease }}
          TAG: ${{ steps.meta.outputs.tag }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          # gh api needs a token to read the release list (prerelease flags).
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "$PRERELEASE" = "true" ]; then
            bash scripts/release_notes.sh "$TAG" any > release-notes.md
          else
            bash scripts/release_notes.sh "$TAG" stable > release-notes.md
          fi
          test -f release-notes.md

      - name: Checkout frontend input
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          repository: SakuraOpenSource/levis-frontend
          ref: ${{ inputs.frontend_ref || 'main' }}
          path: .frontend
          persist-credentials: false

      - name: Record immutable frontend input
        id: frontend
        run: echo "sha=$(git -C .frontend rev-parse HEAD)" >> "$GITHUB_OUTPUT"

      - uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        with:
          version: 12.4.2

      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: 26.7.0
          cache: pnpm
          cache-dependency-path: .frontend/pnpm-lock.yaml

      - name: Frozen frontend checks
        working-directory: .frontend
        run: |
          pnpm install --frozen-lockfile
          pnpm exec vue-tsc -b
          pnpm test
          pnpm build
          test -s dist/index.html

      - name: Inject required frontend
        env:
          FRONTEND_SHA: ${{ steps.frontend.outputs.sha }}
        run: |
          test "$(git -C .frontend rev-parse HEAD)" = "$FRONTEND_SHA"
          rm -rf internal/web/dist
          mkdir -p internal/web/dist
          cp -R .frontend/dist/. internal/web/dist/
          test -s internal/web/dist/index.html

      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with:
          go-version: 1.27.2
          cache: true

      - name: Resolve agent ref
        id: agent
        run: echo "sha=$(git ls-remote https://github.com/SakuraOpenSource/virtualis-agent.git refs/heads/${{ inputs.agent_ref || 'main' }} | cut -f1)" >> "$GITHUB_OUTPUT"

      - name: Build required binaries
        env:
          CGO_ENABLED: '0'
          VERSION: ${{ steps.meta.outputs.tag }}
          AGENT_SHA: ${{ steps.agent.outputs.sha }}
        run: |
          mkdir -p bin/release
          go mod verify
          for target in linux/amd64 linux/arm64 darwin/amd64 darwin/arm64 windows/amd64; do
            os="${target%/*}"; arch="${target#*/}"
            suffix=""; [ "$os" != windows ] || suffix=.exe
            GOOS="$os" GOARCH="$arch" go build -mod=readonly -trimpath -ldflags "-s -w -X main.version=${VERSION}" -o "bin/release/levis-$os-$arch$suffix" ./cmd/levis
            test -s "bin/release/levis-$os-$arch$suffix"
          done

      - name: Record release inputs and checksums
        env:
          FRONTEND_REF: ${{ inputs.frontend_ref || 'main' }}
          FRONTEND_SHA: ${{ steps.frontend.outputs.sha }}
          AGENT_REF: ${{ inputs.agent_ref || 'main' }}
          AGENT_SHA: ${{ steps.agent.outputs.sha }}
        run: |
          python3 .github/scripts/release_manifest.py bin/release/manifest.json
          cd bin/release
          sha256sum * > checksums.txt
          cp checksums.txt SHA256SUMS

      - name: Upload immutable build payload
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: release-payload
          if-no-files-found: error
          path: |
            bin/release/*
            release-notes.md

  publish:
    name: Publish without running source or dependency code
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download build payload
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: release-payload
          path: .release

      - name: Check complete payload
        run: |
          test -s .release/bin/release/manifest.json
          test -f .release/release-notes.md
          cd .release/bin/release
          sha256sum --strict -c checksums.txt

      - name: Create release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          tag_name: ${{ needs.build.outputs.tag }}
          name: ${{ needs.build.outputs.name }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ needs.build.outputs.prerelease }}
          fail_on_unmatched_files: true
          body_path: .release/release-notes.md
          files: .release/bin/release/*
