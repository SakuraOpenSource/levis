name: Release

# Two ways to trigger:
#   - Manual: fill in the release tag (and optional name) on the Actions page;
#     the tag is created on the current commit when it does not exist yet.
#   - Tag push: `git tag v0.1.0 && git push --tags`; the name defaults to the tag.
#
# Tag shape decides the release kind:
#   - v1.2.3            -> stable release
#   - v1.2.3-rc.1       -> pre-release (GitHub "Pre-release" flag set)
#
# Release notes scope:
#   - pre-release: every commit since the last release of ANY kind
#   - stable:      every commit since the last STABLE release
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Release tag, e.g. v0.1.0 (created on the current commit if missing)'
        required: true
      name:
        description: 'Release name; defaults to the tag'
        required: false
      prerelease:
        description: 'Force a pre-release (tags with a suffix are always pre-releases)'
        type: boolean
        default: false
      frontend_ref:
        description: 'Branch or tag of the frontend repository'
        required: false
        default: 'main'
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    name: Build and publish single-file artifacts
    runs-on: ubuntu-latest
    steps:
      - name: Checkout backend
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      # Trigger sources differ, so normalize first; later steps only read
      # these outputs. Inputs travel through env instead of being spliced
      # into the script, so quotes in an input cannot break the command.
      - name: Resolve release metadata
        id: meta
        env:
          INPUT_TAG: ${{ inputs.tag }}
          INPUT_NAME: ${{ inputs.name }}
          INPUT_PRERELEASE: ${{ inputs.prerelease }}
        run: |
          if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
            tag="$INPUT_TAG"
          else
            tag="$GITHUB_REF_NAME"
          fi

          # The tag lands in artifact names and the release itself, so guard
          # against typos early.
          case "$tag" in
            v[0-9]*.[0-9]*.[0-9]*)
              prerelease=false ;;
            v[0-9]*.[0-9]*.[0-9]*-*)
              prerelease=true ;;
            *)
              echo "Tag must look like v1.2.3 (stable) or v1.2.3-rc.1 (pre-release), got: $tag"
              exit 1 ;;
          esac
          # The manual checkbox can force a stable tag out as a pre-release.
          if [ "$INPUT_PRERELEASE" = "true" ]; then
            prerelease=true
          fi

          name="${INPUT_NAME:-$tag}"
          {
            echo "tag=$tag"
            echo "name=$name"
            echo "prerelease=$prerelease"
          } >> "$GITHUB_OUTPUT"
          echo "Releasing $tag (name: $name, prerelease: $prerelease)"

      # Categorize commits by Conventional Commits prefix via the shared
      # script. Runs before the build: broken history should fail fast,
      # not after ten minutes of compiling.
      - name: Generate release notes
        env:
          TAG: ${{ steps.meta.outputs.tag }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          if [ "${{ steps.meta.outputs.prerelease }}" = "true" ]; then
            bash scripts/release_notes.sh "$TAG" any > release-notes.md
          else
            bash scripts/release_notes.sh "$TAG" stable > release-notes.md
          fi
          cat release-notes.md

      # The frontend lives in its own repository; its build output is
      # injected into internal/web/dist before compiling, and go:embed
      # packs it into the final single executable.
      - name: Checkout frontend
        uses: actions/checkout@v6
        with:
          repository: SakuraOpenSource/levis-frontend
          ref: ${{ inputs.frontend_ref || 'main' }}
          path: .frontend

      - uses: pnpm/action-setup@v4
        with:
          version: 11

      - uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: .frontend/pnpm-lock.yaml

      - name: Build frontend
        run: |
          pnpm --dir .frontend install --frozen-lockfile
          pnpm --dir .frontend build

      - name: Inject frontend build
        run: |
          rm -rf internal/web/dist
          mkdir -p internal/web/dist
          cp -R .frontend/dist/. internal/web/dist/
          test -f internal/web/dist/index.html

      - uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache: true

      - name: Cross-compile
        env:
          # Pure-Go SQLite driver + CGO_ENABLED=0: no C toolchain needed
          # for cross-compilation.
          CGO_ENABLED: '0'
          VERSION: ${{ steps.meta.outputs.tag }}
        run: |
          mkdir -p bin/release
          for target in darwin/amd64 darwin/arm64 linux/amd64 linux/arm64 linux/arm windows/amd64 windows/arm64; do
            os="${target%/*}"; arch="${target#*/}"
            out="bin/release/levis-${os}-${arch}"
            [ "$os" = "windows" ] && out="${out}.exe"
            echo "Building ${os}/${arch}"
            GOOS="$os" GOARCH="$arch" go build -trimpath \
              -ldflags "-s -w -X main.version=${VERSION}" \
              -o "$out" ./cmd/levis
          done
          ls -lh bin/release

      - name: Generate checksums
        working-directory: bin/release
        run: sha256sum levis-* > checksums.txt

      - name: Upload build artifacts
        uses: actions/upload-artifact@v5
        with:
          name: levis-binaries
          path: bin/release/*

      # When the tag does not exist yet, this step creates it on
      # target_commitish, so manual runs do not need a pre-pushed tag.
      # Notes come from the categorized release-notes.md above.
      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.name }}
          target_commitish: ${{ github.sha }}
          prerelease: ${{ steps.meta.outputs.prerelease }}
          body_path: release-notes.md
          files: bin/release/*
